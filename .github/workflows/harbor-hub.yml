name: harbor-hub

# GitHub Actions only reads workflows from the repository root, so every job
# here sets working-directory to the server's subdirectory. The paths filters
# keep a change to one server from running the other server's suite.
on:
  pull_request:
    paths:
      - "plugins/harbor-hub/**"
      - ".github/workflows/harbor-hub.yml"
  push:
    branches: [main]
    paths:
      - "plugins/harbor-hub/**"
      - ".github/workflows/harbor-hub.yml"

defaults:
  run:
    working-directory: plugins/harbor-hub

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: make lint
      - run: make test

  integration:
    # Deterministic tool-use tests: the test process invokes the MCP tools
    # directly over stdio (no agent, no Anthropic), talking to the live hub.
    # Auto-skips if HARBOR_API_KEY is absent (e.g. fork PRs get no secrets).
    runs-on: ubuntu-latest
    env:
      HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
      HARBOR_TEST_ORG: ${{ secrets.HARBOR_TEST_ORG }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: make test-integration

  e2e:
    # Full loop using harbor's oracle agent (runs solve.sh, no LLM), so still
    # deterministic and Anthropic-free. The harbor job runs on Modal.
    #
    # Skipped outright without Modal credentials: the suite's own skipif only
    # checks HARBOR_API_KEY, so a run with the harbor key but no Modal token
    # would fail rather than skip.
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HARBOR_TEST_ENV: modal
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --extra modal
      - run: make test-e2e

  evals:
    # THE MERGE GATE on the MCP capability surface: drives the evals with the
    # real claude-code agent and fails unless every reward is 1.0 -- outcome
    # (the answer, self-truthed from the hub) and process (the answer came
    # through the MCP tools, not a harbor CLI shortcut).
    #
    # Unlike every other job here this one spends model tokens, so it is last
    # and narrowly triggered. It needs the hub key, Modal, and Anthropic
    # together; a fork PR gets no secrets, hence the same-repo guard as e2e.
    #
    # It spends them against a Claude subscription rather than API credits.
    # CLAUDE_FORCE_OAUTH makes harbor's claude-code agent blank
    # ANTHROPIC_API_KEY before building the container env, so only
    # CLAUDE_CODE_OAUTH_TOKEN survives and the CLI falls back to subscription
    # auth. Never add ANTHROPIC_API_KEY back: with both present and the flag
    # unset the CLI silently prefers the key and the run is on credits again,
    # with only a debug log to say so.
    #
    # Serialized across runs on purpose. Subscription rate limits are per
    # account and shared with interactive use, so overlapping gates would eat
    # the same 5-hour window.
    #
    # HARBOR_MCP_REF makes the eval images pip-install harbor-mcp from the
    # commit under review instead of main. Without it the gate builds main's
    # server and passes a PR that breaks the MCP -- a green check that means
    # nothing. On a push to main the head sha IS main.
    runs-on: ubuntu-latest
    needs: [lint-unit]
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    concurrency:
      group: harbor-hub-evals
      cancel-in-progress: false
    env:
      HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_FORCE_OAUTH: "1"
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HARBOR_TEST_ENV: modal
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --extra modal
      # run_evals.sh calls the bare `harbor` console script from the venv.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # A `setup-token` credential is long-lived but not permanent. Without
      # this probe an expired one surfaces as "the evals did not all reach
      # reward 1.0" -- a red gate that reads as an MCP regression and isn't.
      # Fails rather than skips on a missing token, matching this repo's stance
      # that a secret-dependent job silently going green is the worse failure.
      # Only a 401 is fatal: the token is not necessarily scoped for direct
      # /v1/messages calls, so no other status is evidence either way.
      - name: Check the subscription token
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Mint one with 'claude setup-token' and add it as a repository secret."
            exit 1
          fi
          status="$(curl -sS -o /tmp/auth-probe.json -w '%{http_code}' \
            https://api.anthropic.com/v1/messages \
            -H "Authorization: Bearer $CLAUDE_CODE_OAUTH_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: oauth-2025-04-20" \
            -H "content-type: application/json" \
            -d '{"model":"claude-haiku-4-5","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}')"
          if [ "$status" = "401" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is expired or revoked. Mint a new one with 'claude setup-token' and update the repository secret."
            exit 1
          fi
          echo "Auth probe returned HTTP $status; proceeding."
      - name: Run the eval gate (claude-code)
        env:
          # The PR's merge commit is not on the remote, so pip could not fetch
          # it; head.sha is the branch tip and is pushed.
          HARBOR_MCP_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          EVALS_OUT_DIR: ${{ runner.temp }}/eval-trials
          # Push to main only. PR runs would mint a hub job per push with
          # nothing to clean them up; main's runs are the ones worth keeping a
          # reward/cost/token trend for.
          EVALS_UPLOAD: ${{ github.event_name == 'push' && '1' || '' }}
        run: make evals
      # A `process` failure is only diagnosable from the agent's trajectory:
      # the score alone cannot distinguish a tool-name mismatch from a real
      # CLI shortcut. Keep the trials so the next step is reading them, not
      # re-running the gate.
      - name: Upload trials for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-trials
          path: ${{ runner.temp }}/eval-trials
          retention-days: 7
