name: harbor-hub eval-safety

# Runs only when harbor-mcp's evals change: prove each eval is solvable by its
# oracle and not trivially passable by a no-op agent. No LLM/Anthropic cost.
# This is NOT the merge gate on the MCP capabilities (that is the `evals` job)
# -- it is the safety net that keeps the evals themselves honest. Runs on modal,
# the same provider the gate uses.
on:
  pull_request:
    paths:
      - "plugins/harbor-hub/evals/**"
      - ".github/workflows/harbor-hub-eval-safety.yml"

defaults:
  run:
    working-directory: plugins/harbor-hub

jobs:
  eval-safety:
    runs-on: ubuntu-latest
    env:
      HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HARBOR_TEST_ENV: modal
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --extra modal
      # run_eval_safety.sh calls the bare `harbor` console script from the venv.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run eval-safety (oracle + nop)
        run: |
          if [ -z "${HARBOR_API_KEY:-}" ]; then
            echo "HARBOR_API_KEY absent (fork PR?); skipping eval-safety."
            exit 0
          fi
          make eval-safety
