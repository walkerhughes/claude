name: tastytrade

# GitHub Actions only reads workflows from the repository root, so every job
# here sets working-directory to the server's subdirectory. The paths filters
# keep a change to one server from running the other server's suite.
on:
  pull_request:
    paths:
      - "plugins/tastytrade/**"
      - ".github/workflows/tastytrade.yml"
  push:
    branches: [main]
    paths:
      - "plugins/tastytrade/**"
      - ".github/workflows/tastytrade.yml"

defaults:
  run:
    working-directory: plugins/tastytrade

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint & typecheck
        run: make check

      - name: Coverage (unit + integration)
        run: make coverage

      - name: Validate eval task verifiers
        run: make validate-tasks
