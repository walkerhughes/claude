[task]
name = "fred-mcp/revision-count"
description = "Across the observations available for real GDP (GDPC1), count how many have been revised since they were first published, that is, how many now hold a different value than the one first reported."

[metadata]
suite = "fred-mcp"

[environment]
docker_image = "fred-bench"
network_mode = "public"

[agent]
timeout_sec = 300

[verifier]
timeout_sec = 60
