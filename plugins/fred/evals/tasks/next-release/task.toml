[task]
name = "fred-mcp/next-release"
description = "The Employment Situation release has FRED release id 50. Find the date of its NEXT scheduled release, that is, the first one still in the future. Report it as YYYY-MM-DD."

[metadata]
suite = "fred-mcp"

[environment]
docker_image = "fred-bench"
network_mode = "public"

[agent]
timeout_sec = 300

[verifier]
timeout_sec = 60
