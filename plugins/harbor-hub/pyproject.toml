[project]
name = "harbor-mcp"
version = "0.1.0"
description = "MCP server for the Harbor hub: verify uploads, fetch job results, publish packages"
readme = "README.md"
# The LICENSE file lives at the monorepo root, outside this project directory,
# so it is declared here but not bundled.
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: we import harbor internals (hub, upload, publisher, db),
    # which are not a stable public API. Bump deliberately.
    "harbor==0.18.0",
    # Capped below 2: mcp 2.0.0 removed mcp.server.fastmcp, which server.py
    # imports. uv.lock hid this locally (pinned 1.28.1) while every fresh
    # `pip install harbor-mcp` resolved 2.0.0 and crashed the server on import.
    # Lifting the cap means porting server.py off mcp.server.fastmcp first.
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
# Only needed to run tests/evals with HARBOR_TEST_ENV=modal. Kept out of the
# base install so read-only use stays lean. Install with: uv sync --extra modal.
modal = ["harbor[modal]==0.18.0"]

[project.scripts]
harbor-mcp = "harbor_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: talks to the live Harbor hub; needs HARBOR_API_KEY",
    "e2e: runs harbor jobs on HARBOR_TEST_ENV (docker|modal); needs HARBOR_API_KEY",
]
addopts = ["-v", "--tb=short", "--strict-markers", "--strict-config", "-m", "not integration and not e2e"]

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py312"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["harbor_mcp"]
